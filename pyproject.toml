[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rca"
version = "0.1.0"
description = "AI-assisted incident triage & root-cause analysis for data pipelines"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rca"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
# CLIs may print; everything else uses structured logging.
"**/__main__.py" = ["T20"]
"**/cli.py" = ["T20"]
"src/rca/faults/demo.py" = ["T20"]
"eval/*.py" = ["T20"]  # eval scripts are CLIs  # backs `make demo`; its output is the product

[tool.ruff.lint.isort]
known-first-party = ["rca"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["rca"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["rca.guardrails.*", "rca.agent.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Docker stack (`make up`)",
    "system: full end-to-end run across the whole stack",
]
